name: Build APK

on:
  push:
    # Changing the server address, the sheet script or the README needs no new app version.
    paths-ignore:
      - "config.json"
      - "apps-script/**"
      - "auth-service/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set version
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$code" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "AVIP-Solar-Expense-${VERSION_NAME}.apk"
          # Fixed name, so .../releases/latest/download/AVIP-Solar-Expense.apk always gets the newest
          cp app/build/outputs/apk/release/app-release.apk AVIP-Solar-Expense.apk

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong" -A4 build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: AVIP-Solar-Expense-${{ env.VERSION_NAME }}-apk
          path: AVIP-Solar-Expense-${{ env.VERSION_NAME }}.apk

      # Phones check this release on launch and update themselves (compulsory).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AVIP Solar Expense ${{ env.VERSION_NAME }}
          body: Automatic build from commit ${{ github.sha }}.
          files: |
            AVIP-Solar-Expense-${{ env.VERSION_NAME }}.apk
            AVIP-Solar-Expense.apk
          make_latest: true
